<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王现永的学习日志</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      color: #333;
      background: #f8f9fa;
      padding: 2rem 1rem;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid #e8eaed;
    }

    p {
      margin-bottom: 1.5rem;
      color: #555;
    }

    ul {
      list-style: none;
      padding-left: 0;
    }

    li {
      padding: 0.5rem 0;
      padding-left: 1.25rem;
      position: relative;
      color: #444;
    }

    li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #2e7d32;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>王现永的学习日志</h1>
    <p>
      我是去哪儿酒店产品经理，正在学编程。用代码记录成长，一步一步把想法变成能跑的东西。
    </p>
    <ul>
      <li>今天是 Day 3</li>
      <li>已经学会终端 + Git</li>
    </ul>
  </main>
</body>
</html>
