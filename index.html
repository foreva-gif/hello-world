<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王现永的学习日志</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-page: #f8f9fa;
      --bg-card: #fff;
      --text-primary: #1a1a1a;
      --text-body: #555;
      --text-muted: #444;
      --border: #e8eaed;
      --shadow: rgba(0, 0, 0, 0.06);
      --accent: #2e7d32;
      --btn-bg: #fff;
      --btn-border: #d0d7de;
      --btn-text: #333;
    }

    [data-theme="dark"] {
      --bg-page: #121212;
      --bg-card: #1e1e1e;
      --text-primary: #f0f0f0;
      --text-body: #b0b0b0;
      --text-muted: #c8c8c8;
      --border: #333;
      --shadow: rgba(0, 0, 0, 0.35);
      --accent: #66bb6a;
      --btn-bg: #2a2a2a;
      --btn-border: #444;
      --btn-text: #e0e0e0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      color: var(--text-body);
      background: var(--bg-page);
      padding: 2rem 1rem;
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 10;
      padding: 0.45rem 0.85rem;
      font-size: 0.875rem;
      font-family: inherit;
      color: var(--btn-text);
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 1px 4px var(--shadow);
      transition: background 0.25s ease, border-color 0.25s ease, color 0.25s ease;
    }

    .theme-toggle:hover {
      opacity: 0.85;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px var(--shadow);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 2px solid var(--border);
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    p {
      margin-bottom: 1.5rem;
      color: var(--text-body);
    }

    ul {
      list-style: none;
      padding-left: 0;
    }

    li {
      padding: 0.5rem 0;
      padding-left: 1.25rem;
      position: relative;
      color: var(--text-muted);
    }

    li::before {
      content: "✓";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-weight: 600;
    }

    h2 {
      font-size: 1.125rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 2rem;
      margin-bottom: 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    ol {
      padding-left: 1.25rem;
      color: var(--text-muted);
    }

    ol li {
      padding: 0.35rem 0;
      padding-left: 0;
    }

    ol li::before {
      content: none;
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题">
    ☀️ 浅色
  </button>

  <main>
    <h1>王现永的学习日志</h1>
    <p>
      我是去哪儿酒店产品经理，正在学编程。用代码记录成长，一步一步把想法变成能跑的东西。
    </p>
    <ul>
      <li>今天是 Day 3</li>
      <li>已经学会终端 + Git</li>
    </ul>

    <h2>学习记录</h2>
    <ol>
      <li>完成了第三天的练习，学了 git status、git add、git commit、git push</li>
      <li>完成 git 的配置</li>
    </ol>
  </main>

  <script>
    const html = document.documentElement;
    const toggle = document.getElementById("themeToggle");

    function applyTheme(theme) {
      html.setAttribute("data-theme", theme);
      toggle.textContent = theme === "dark" ? "☀️ 浅色" : "🌙 暗色";
      localStorage.setItem("theme", theme);
    }

    const saved = localStorage.getItem("theme");
    if (saved === "light" || saved === "dark") {
      applyTheme(saved);
    }

    toggle.addEventListener("click", () => {
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      applyTheme(next);
    });
  </script>
</body>
</html>
